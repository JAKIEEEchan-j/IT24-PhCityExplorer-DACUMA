!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PH City Explorer</title>
 
  <!-- Leaflet (map library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Our styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🇵🇭 PH City Explorer</h1>
    <p>Search a Philippine city and see it on the map.</p>
  </header>
 
  <form id="searchForm">
    <input type="text" id="cityInput" placeholder="e.g. General Santos, Davao, Cebu" autocomplete="off" />
    <button type="submit" id="searchBtn">Search</button>
  </form>
 
  <div id="message"></div>
  <div id="map"></div>
 
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
